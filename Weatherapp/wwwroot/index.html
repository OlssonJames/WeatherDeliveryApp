<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Väder & Leveranstid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone {
            width: 320px;
            background: #ffffff;
            border-radius: 40px;
            padding: 40px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }

        .location {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

            .location input {
                border: none;
                background: transparent;
                text-align: center;
                font-size: 14px;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: #333;
                width: 90px;
            }

            .location button {
                border: none;
                background: #f0f0f0;
                border-radius: 20px;
                padding: 4px 10px;
                font-size: 12px;
                color: #666;
                cursor: pointer;
            }

        .sun {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

            .sun svg {
                width: 100%;
                height: 100%;
            }

        .temp-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 6px;
        }

        .dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #eee;
        }

        .temp {
            font-size: 56px;
            font-weight: 300;
            color: #222;
        }

        .now {
            font-size: 12px;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .stat-icon {
            font-size: 18px;
        }

        .stat-value {
            font-size: 13px;
            color: #555;
        }

        .delivery {
            background: #f8f8f8;
            border-radius: 20px;
            padding: 18px;
            text-align: left;
        }

        .delivery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .delivery-title {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
        }

        .risk-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            color: #fff;
        }

        .risk-Låg {
            background: #34c759;
        }

        .risk-Medel {
            background: #ff9500;
        }

        .risk-Hög {
            background: #ff3b30;
        }

        .delay {
            font-size: 24px;
            font-weight: 500;
            color: #222;
            margin-bottom: 8px;
        }

        .warnings {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }

            .warnings div {
                margin-bottom: 4px;
            }

        .loading, .error {
            font-size: 13px;
            color: #999;
            padding: 20px 0;
        }

        .error {
            color: #ff3b30;
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="location">
            <input id="locationInput" value="GÖTEBORG" />
            <button onclick="loadWeather()">Sök</button>
        </div>

        <div class="sun">
            <svg viewBox="0 0 100 100" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round">
                <circle cx="50" cy="55" r="22" />
                <line x1="50" y1="10" x2="50" y2="18" />
                <line x1="20" y1="25" x2="26" y2="30" />
                <line x1="80" y1="25" x2="74" y2="30" />
                <path d="M15 65 Q30 55 45 65 T75 65" stroke="#ccc" />
            </svg>
        </div>

        <div id="content">
            <div class="loading">Hämtar väder...</div>
        </div>
    </div>

    <script>
  const API_BASE = "/api/Weather";

  const locations = {
    "GÖTEBORG": { lat: 57.7, lon: 11.97 },
    "STOCKHOLM": { lat: 59.33, lon: 18.06 },
    "MALMÖ": { lat: 55.60, lon: 13.00 },
  };

  async function loadWeather() {
    const contentEl = document.getElementById("content");
    contentEl.innerHTML = '<div class="loading">Hämtar väder...</div>';

    const name = document.getElementById("locationInput").value.trim().toUpperCase();
    const coords = locations[name] || locations["GÖTEBORG"];

    try {
      const res = await fetch(`${API_BASE}?lat=${coords.lat}&lon=${coords.lon}`);
      if (!res.ok) throw new Error("API-fel: " + res.status);
      const data = await res.json();
      render(data);
    } catch (err) {
      contentEl.innerHTML = `<div class="error">Kunde inte hämta data.<br>${err.message}</div>`;
    }
  }

  function render(data) {
    const contentEl = document.getElementById("content");

    const warningsHtml = data.warnings.map(w => `<div>• ${w}</div>`).join("");

    contentEl.innerHTML = `
      <div class="temp-row">
        <div class="dot"></div>
        <div class="temp">${Math.round(data.temperatureC)}°</div>
      </div>
      <div class="now">NU</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-icon">💧</div>
          <div class="stat-value">${data.precipitationMm} mm</div>
        </div>
        <div class="stat">
          <div class="stat-icon">🌬️</div>
          <div class="stat-value">${data.windSpeedKmh} km/h</div>
        </div>
      </div>

      <div class="delivery">
        <div class="delivery-header">
          <div class="delivery-title">Leveranspåverkan</div>
          <div class="risk-badge risk-${data.riskLevel}">${data.riskLevel}</div>
        </div>
        <div class="delay">+${data.delayMinutes} min</div>
        <div class="warnings">${warningsHtml}</div>
      </div>
    `;
  }

  loadWeather();
    </script>

</body>
</html>
